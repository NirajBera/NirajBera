<style>text{font-family:'JetBrains Mono','Cascadia Code','SF Mono',Consolas,'DejaVu Sans Mono','Liberation Mono',monospace;white-space:pre}.bl{animation:bl 1s steps(1) infinite}@keyframes bl{50%{opacity:0}}.lv{animation:lv 1.6s ease-in-out infinite}@keyframes lv{50%{opacity:.3}}.sf{font-family:Inter,'Segoe UI',system-ui,-apple-system,Roboto,Helvetica,Arial,sans-serif;white-space:normal}
